<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayBreak Store Screenshot — Checkout</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f7f8; color: #17171a; }
      .shop-header { height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 0 70px; background: white; border-bottom: 1px solid #e8e8eb; }
      .shop-brand { font-size: 20px; font-weight: 800; }
      .shop-step { color: #81818a; font-size: 14px; }
      .checkout { width: 1050px; margin: 54px auto; display: grid; grid-template-columns: 1fr 360px; gap: 42px; }
      .panel { background: white; border: 1px solid #e5e5e8; border-radius: 16px; padding: 28px; }
      .line { height: 13px; border-radius: 7px; background: #ececf0; margin: 15px 0; }
      .line.short { width: 42%; }
      .product { display: flex; gap: 18px; margin-top: 24px; }
      .product-img { width: 112px; height: 112px; border-radius: 12px; background: #e1e6ef; }
      .product-copy { flex: 1; }
      .total { display: flex; justify-content: space-between; margin-top: 28px; padding-top: 20px; border-top: 1px solid #e8e8eb; font-size: 18px; font-weight: 800; }
    </style>
  </head>
  <body>
    <header class="shop-header"><span class="shop-brand">Sample Shop</span><span class="shop-step">장바구니 &gt; 주문서 &gt; 결제</span></header>
    <main class="checkout">
      <section class="panel">
        <h1>주문 상품</h1>
        <div class="product"><div class="product-img"></div><div class="product-copy"><div class="line"></div><div class="line short"></div><div class="line"></div></div></div>
      </section>
      <aside class="panel"><h2>결제 정보</h2><div class="line"></div><div class="line"></div><div class="total"><span>총 결제 금액</span><span>238,000원</span></div></aside>
    </main>
    <script>
      window.chrome = { runtime: { sendMessage: async () => ({ ok: true }) } }
    </script>
    <script type="module">
      import { mountOverlay } from '../../src/content/overlay.ts'
      mountOverlay(238000, {
        targetAmount: 100000000,
        targetMonths: 60,
        monthlySavingsTarget: 1666667,
        hourlyWage: 18000,
        cooldownSeconds: 30,
        salaryType: 'hourly',
        monthlySalary: 0,
      }, 'shopping.example')
    </script>
  </body>
</html>
