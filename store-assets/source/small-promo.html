<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayBreak Small Promo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        width: 440px;
        height: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, "Malgun Gothic", sans-serif;
        background:
          radial-gradient(circle at 82% 18%, rgba(59, 130, 246, 0.26), transparent 33%),
          radial-gradient(circle at 10% 90%, rgba(34, 197, 94, 0.18), transparent 37%),
          #0d1017;
        color: #f5f5f7;
      }
      main { width: 100%; height: 100%; padding: 30px 34px; display: grid; grid-template-columns: 1fr 150px; align-items: center; gap: 18px; }
      .brand { display: flex; flex-direction: column; align-items: flex-start; gap: 13px; }
      img { width: 96px; height: 96px; margin: -12px; }
      .name { font-size: 34px; font-weight: 900; letter-spacing: -0.04em; }
      .sub { color: #a7adba; font-size: 14px; font-weight: 700; }
      .timer { position: relative; width: 142px; height: 142px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#4ade80 0deg 286deg, #252b37 286deg 360deg); box-shadow: 0 18px 45px rgba(0,0,0,.35); }
      .timer::before { content: ""; position: absolute; width: 111px; height: 111px; border-radius: 50%; background: #11151e; }
      .timer span { position: relative; color: #f5f5f7; font-size: 40px; font-weight: 900; letter-spacing: -0.05em; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="/icons/icon128.png" alt="" /><span class="name">PayBreak</span><span class="sub">결제 전 잠깐의 브레이크</span></div>
      <div class="timer" aria-label="30초 타이머"><span>30s</span></div>
    </main>
  </body>
</html>
