<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Deep Slate Dark Navy Canvas -->
  <rect width="128" height="128" rx="28" fill="#0F172A"/>

  <!-- PB Wordmark with Safety Padding -->
  <!-- Layer 1: Bold White Contrast Outer Border -->
  <text x="64" y="92"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif"
        font-size="78"
        font-weight="900"
        letter-spacing="-3"
        text-anchor="middle"
        fill="#000000"
        stroke="#FFFFFF"
        stroke-width="16"
        stroke-linejoin="round">PB</text>

  <!-- Layer 2: Solid Black Core Glyph -->
  <text x="64" y="92"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif"
        font-size="78"
        font-weight="900"
        letter-spacing="-3"
        text-anchor="middle"
        fill="#000000">PB</text>
</svg>
